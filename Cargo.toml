[workspace]
members = ["native", "launcher", "benchmarks/native", "tool/platform_probe/native"]
resolver = "2"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.dev.package.gpuidart]
debug = 1

[profile.test.package.gpuidart]
debug = 1

[profile.release]
panic = "unwind"
# Whole-program optimization and one codegen unit shrink the native library,
# whose mapped pages are part of every host's memory floor.
lto = "fat"
codegen-units = 1

# Vendored copies with narrow patches; provenance and patch-only diffs are in
# native/vendor/README.md. Each copy is the version the lockfile already
# resolved, so dependency versions are unchanged; GPUI Kit itself stays a git
# pin in native/Cargo.toml.
[patch.crates-io]
accesskit_atspi_common = { path = "native/vendor/accesskit_atspi_common-0.19.1" }
accesskit_consumer = { path = "native/vendor/accesskit_consumer-0.38.0" }
accesskit_windows = { path = "native/vendor/accesskit_windows-0.34.0" }
gpui-pre = { path = "native/vendor/gpui-pre-0.3.7" }
gpui-pre-windows = { path = "native/vendor/gpui-pre-windows-0.3.7" }
accesskit_unix = { path = "native/vendor/accesskit_unix-0.22.1" }
