[package]
name = "gpuidart-windows-tool"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde_json = "1"
png = "0.18"
windows-registry = "0.6"
windows = { version = "0.61", features = ["Networking_Connectivity"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
