[package]
name = "gpuidart-native-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Rpc", "Win32_System_Variant", "Win32_System_Wmi", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
