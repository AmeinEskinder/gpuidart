[package]
name = "gpuidart"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
benchmark-trace = []
allocation-profile = []
snapshot-experiment = []

[[bin]]
name = "gpuidart-snapshot-experiment"
path = "src/bin/snapshot_experiment.rs"
required-features = ["snapshot-experiment"]

[dependencies]
async-channel = "2"
base64 = "0.22"
chrono = "0.4"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0", features = ["profiler"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
libc = "0.2"

# The window handle behind a GPUI window, to ask Windows for a repaint the
# moment an update from the application has landed.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0", features = ["test-support"] }

# Startup timing probe only; the same crate version the pinned Windows platform uses.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
