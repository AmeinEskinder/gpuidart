[package]
name = "gpuidart"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
benchmark-trace = []
allocation-profile = []
snapshot-experiment = []

[[bin]]
name = "gpuidart-snapshot-experiment"
path = "src/bin/snapshot_experiment.rs"
required-features = ["snapshot-experiment"]

[dependencies]
async-channel = "2"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0", features = ["profiler"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0", features = ["test-support"] }
