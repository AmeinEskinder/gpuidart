name: Accessibility platform probes

on:
  push:
    paths:
      - 'tool/accessibility/**'
      - 'tool/verify_settings.dart'
      - 'tool/src/dev_session.dart'
      - '.github/workflows/accessibility.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'native/**'
      - 'lib/**'
      - 'example/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_BACKTRACE: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.13.4'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Linux rendering and external AT-SPI client
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 mesa-vulkan-drivers xvfb openbox dbus-x11 at-spi2-core gir1.2-atspi-2.0 python3-gi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: accessibility-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            accessibility-${{ runner.os }}-${{ runner.arch }}-
            ${{ runner.os == 'macOS' && 'macos-sdk-window-' || runner.os == 'Linux' && 'linux-sdk-window-' || 'windows-sdk-' }}
      - name: Build pinned native host
        run: |
          rustup show active-toolchain
          dart pub get --enforce-lockfile
          dart run tool/accessibility/verify_vendor.dart
          cargo build --locked -p gpuidart -p gpuidart-launcher
      - name: Build macOS external AX client
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/accessibility
          swiftc tool/accessibility/macos.swift -o build/accessibility/ax-probe
      - name: Theme and navigation live FFI tests
        if: runner.os != 'Linux'
        run: dart test test/theme_host_test.dart test/tabs_host_test.dart test/menus_host_test.dart test/row_menu_host_test.dart test/radio_host_test.dart --reporter expanded
      - name: External Windows UIA or macOS AX query and action
        if: runner.os != 'Linux'
        run: dart run tool/accessibility/probe.dart build/accessibility/platform-spike.json
      - name: External Linux AT-SPI query and action
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/accessibility
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' bash -e -o pipefail <<'PROBE'
          unset WAYLAND_DISPLAY ZED_HEADLESS
          openbox >build/accessibility/openbox.log 2>&1 &
          gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.freedesktop.DBus.Properties.Set org.a11y.Status IsEnabled '<true>'
          gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.freedesktop.DBus.Properties.Set org.a11y.Status ScreenReaderEnabled '<true>'
          dart test test/theme_host_test.dart test/tabs_host_test.dart test/menus_host_test.dart test/row_menu_host_test.dart test/radio_host_test.dart --reporter expanded
          dart run tool/accessibility/probe.dart build/accessibility/platform-spike.json
          dart run tool/accessibility/controls.dart build/accessibility/controls.json
          dart run tool/accessibility/disabled.dart build/accessibility/disabled.json
          dart run tool/verify_settings.dart build/accessibility/settings.json --semantics
          dart run tool/accessibility/watchlist.dart build/accessibility/watchlist.json
          PROBE
      - name: External control actions
        if: runner.os != 'Linux'
        run: dart run tool/accessibility/controls.dart build/accessibility/controls.json
      - name: Disabled control states and actions
        if: runner.os != 'Linux'
        run: dart run tool/accessibility/disabled.dart build/accessibility/disabled.json
      - name: Settings semantics at every verifier step
        if: runner.os != 'Linux'
        run: dart run tool/verify_settings.dart build/accessibility/settings.json --semantics
      - name: Watchlist viewport semantics and record identity
        if: runner.os != 'Linux'
        run: dart run tool/accessibility/watchlist.dart build/accessibility/watchlist.json
      - name: Retain platform responses and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/accessibility/*.json
            build/accessibility/*.log
          retention-days: 14
