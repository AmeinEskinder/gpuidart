name: Notarized macOS package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-notarized-release
  cancel-in-progress: false

jobs:
  notarize:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.13.4'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: notarized-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            unix-package-macOS-ARM64-
            notarized-macos-
      - name: Build native CLI
        run: |
          rustup show active-toolchain
          dart pub get --enforce-lockfile
          dart run tool/build_cli.dart
      - name: Sign, notarize and verify the extracted package
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: dart run tool/macos_release.dart
      - name: Retain signing and notarization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-notarization-evidence
          path: |
            build/Watchlist-macos-arm64-*/macos-*.json
            build/Watchlist-macos-arm64-*/manifest.json
            build/package-evidence/notarized-verification.json
          retention-days: 30
      - name: Retain verified notarized package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notarized-macos-arm64
          path: build/Watchlist-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30
