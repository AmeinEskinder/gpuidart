name: Unix process lifecycle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unix-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  processes:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.13.4'
      - name: Build the session launcher and verify descendant cleanup
        run: |
          rustup show active-toolchain
          cargo build --locked -p gpuidart-launcher
          dart pub get --enforce-lockfile
          dart test test/dev_session_test.dart test/owned_process_test.dart
